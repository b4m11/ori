name: Create Codespace and print URL

on:
  pull_request:
    types: [labeled]

env:
  FORWARDED_PORT: 3000

jobs:
  create-codespace:
    if: github.event.label.name == 'run-codespace'
    runs-on: ubuntu-latest

    steps:
      - name: Create Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_HEAD_REF}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          echo "Creating codespace for ${OWNER}/${REPO} on branch ${BRANCH}..."

          CODESPACE_NAME="$(gh codespace create \
            --repo "${OWNER}/${REPO}" \
            --branch "${BRANCH}" \
            --machine basicLinux32gb)"

          if [ -z "${CODESPACE_NAME}" ]; then
            echo "Failed to create Codespace."
            exit 1
          fi

          FORWARDED_URL="https://${CODESPACE_NAME}-${FORWARDED_PORT}.app.github.dev"

          echo "Codespace name: ${CODESPACE_NAME}"
          echo "Forwarded URL for port ${FORWARDED_PORT}: ${FORWARDED_URL}"

          echo "codespace_name=${CODESPACE_NAME}" >> "$GITHUB_OUTPUT"
          echo "forwarded_url=${FORWARDED_URL}" >> "$GITHUB_OUTPUT"
