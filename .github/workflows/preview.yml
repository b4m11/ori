name: Preview Codespace

on:
  pull_request:
    types: [labeled, unlabeled]

env:
  FORWARDED_PORT: 8000
  RUN_CMD: "python3 server.py"

jobs:
  create-codespace:
    if: github.event.label.name == 'run-codespace'
    runs-on: ubuntu-latest

    steps:
      - name: Create Codespace and comment result
        if: ${{ contains(github.event.pull_request.labels.*.name, 'run-codespace') }}
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          BRANCH="${GITHUB_HEAD_REF}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          echo "Creating codespace for ${OWNER}/${REPO} on branch ${BRANCH}..."

          touch devcontainer.json
          echo '
          // For format details, see https://aka.ms/devcontainer.json. For config options, see the
          // README at: https://github.com/devcontainers/templates/tree/main/src/python
          {
            "name": "Python 3",
            // Or use a Dockerfile or Docker Compose file. More info: https://containers.dev/guide/dockerfile
            "image": "mcr.microsoft.com/devcontainers/python:0-3.11-bullseye",
            "features": {
              "ghcr.io/devcontainers-contrib/features/coverage-py:2": {}
            },

            // Use 'forwardPorts' to make a list of ports inside the container available locally.
            "forwardPorts": [$FORWARDED_PORT],

            // Use 'postCreateCommand' to run commands after the container is created.
            "postCreateCommand": \""$RUN_CMD\"",

            // Configure tool-specific properties.
            "customizations": {
              // Configure properties specific to VS Code.
              "vscode": {
                // Add the IDs of extensions you want installed when the container is created.
                "extensions": [
                  "streetsidesoftware.code-spell-checker"
                ]
              }
            }

            // Uncomment to connect as root instead. More info: https://aka.ms/dev-containers-non-root.
            // "remoteUser": "root"
          }
          ' >> devcontainer.json

          cat devcontainer.json
          gh codespace create \
            --repo "${OWNER}/${REPO}" \
            --branch "${BRANCH}" \
            --devcontainer-path 'devcontainer.json' \
            --machine basicLinux32gb

          if [ $? -eq 0 ]; then
            CODESPACE_NAME="$(gh codespace list --repo "${OWNER}/${REPO}" --limit 100 --json repository,name,gitStatus --jq ".[] | select(((if .repository | type == \"object\" then .repository.fullName else .repository end) == \"${OWNER}/${REPO}\") and (.gitStatus | type == \"object\" and (.ref == \"refs/heads/${BRANCH}\" or .ref == \"${BRANCH}\"))) | .name")"
            
            # CODESPACE_NAME="$(gh codespace list --repo "${OWNER}/${REPO}" --branch "${BRANCH}" --limit 100 --json name,createdAt --jq 'sort_by(.createdAt) | reverse | .[0].name')"
            
            echo "Newest codespace name: ${CODESPACE_NAME}"

            gh codespace ports forward --codespace "${CODESPACE_NAME}" 80:${FORWARDED_PORT}
            gh codespace ports visibility --codespace "${CODESPACE_NAME}" 80:public

            FORWARDED_URL="https://${CODESPACE_NAME}-${FORWARDED_PORT}.app.github.dev"

            echo "codespace_name=${CODESPACE_NAME}" >> "$GITHUB_OUTPUT"
            echo "forwarded_url=${FORWARDED_URL}" >> "$GITHUB_OUTPUT"

            cat <<< "
            ## ✅ Preview Codespace Ready
            | | |
            |---|---|
            | **Branch** | \`${BRANCH}\` |
            | **Codespace** | \`${CODESPACE_NAME}\` |
            | **URL** | [Open Preview](${FORWARDED_URL}) |
            " | sed 's/^            //' | gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" -F-
          else
            BODY="
            ## ❌ Codespace Creation Failed
            The codespace for branch \`${BRANCH}\` could not be created.
            ${RESULT}
            "

            gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" --body "${BODY}"
          fi
          

      - name: Delete Codespace if label does not exist
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'run-codespace') }}
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          BRANCH="${GITHUB_HEAD_REF}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          echo "Checking for existing codespace for ${OWNER}/${REPO} on branch ${BRANCH}..."

          CODESPACE_NAME="$(gh codespace list --repo "${OWNER}/${REPO}" --limit 100 --json repository,name,gitStatus --jq ".[] | select(((if .repository | type == \"object\" then .repository.fullName else .repository end) == \"${OWNER}/${REPO}\") and (.gitStatus | type == \"object\" and (.ref == \"refs/heads/${BRANCH}\" or .ref == \"${BRANCH}\"))) | .name")"

          if [ -n "${CODESPACE_NAME}" ]; then
            echo "Found codespace(s) to delete:"
            echo "${CODESPACE_NAME}"
            echo "${CODESPACE_NAME}" | while read -r name; do
              if [ -n "${name}" ]; then
                echo "Deleting codespace: ${name}..."
                gh codespace delete --codespace "${name}" --force
              fi
            done

            gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" --body "## 🗑️ Preview Codespace Deleted

            The preview codespace for branch \`${BRANCH}\` has been deleted."
          else
            echo "No codespace found to delete."
          fi

