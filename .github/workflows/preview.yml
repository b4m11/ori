name: Preview Codespace

on:
  pull_request:
    types: [labeled, unlabeled]

env:
  FORWARDED_PORT: 3000

jobs:
  create-codespace:
    if: github.event.label.name == 'run-codespace'
    runs-on: ubuntu-latest

    steps:
      - name: Create Codespace and comment result
        if: ${{ contains(github.event.pull_request.labels.*.name, 'run-codespace') }}
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          BRANCH="${GITHUB_HEAD_REF}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          echo "Creating codespace for ${OWNER}/${REPO} on branch ${BRANCH}..."

          if RESULT="$(gh codespace create \
            --repo "${OWNER}/${REPO}" \
            --branch "${BRANCH}" \
            --machine basicLinux32gb 2>&1)"; then

            echo "${RESULT}"
            gh codespace ports forward --codespace "${RESULT}" 80:${FORWARDED_PORT}

            gh codespace ports visibility --codespace "${RESULT}" 80:public

            CODESPACE_NAME="${RESULT}"
            FORWARDED_URL="https://${CODESPACE_NAME}-${FORWARDED_PORT}.app.github.dev"

            gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" --body "## ✅ Preview Codespace Ready

            | | |
            |---|---|
            | **Branch** | \`${BRANCH}\` |
            | **Codespace** | \`${CODESPACE_NAME}\` |
            | **URL** | [Open Preview](${FORWARDED_URL}) |"

                        echo "codespace_name=${CODESPACE_NAME}" >> "$GITHUB_OUTPUT"
                        echo "forwarded_url=${FORWARDED_URL}" >> "$GITHUB_OUTPUT"

                      else
                        gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" --body "## ❌ Codespace Creation Failed

            The codespace for branch \`${BRANCH}\` could not be created.

            <details>
            <summary>Error details</summary>

            \`\`\`
            ${RESULT}
            \`\`\`

            </details>"

            exit 1
          fi

      - name: Delete Codespace if label does not exist
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'run-codespace') }}
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          BRANCH="${GITHUB_HEAD_REF}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          echo "Checking for existing codespace for ${OWNER}/${REPO} on branch ${BRANCH}..."

          CODESPACE_NAME="$(gh codespace list --limit 100 --json repository,name,gitStatus --jq ".[] | select(.repository == \"${OWNER}/${REPO}\" and .gitStatus.branch == \"${BRANCH}\") | .name")"

          if [ -n "${CODESPACE_NAME}" ]; then
            echo "Found codespace(s) to delete:"
            echo "${CODESPACE_NAME}"
            echo "${CODESPACE_NAME}" | while read -r name; do
              if [ -n "${name}" ]; then
                echo "Deleting codespace: ${name}..."
                gh codespace delete --codespace "${name}" --force
              fi
            done

            gh pr comment "${PR_NUMBER}" --repo "${OWNER}/${REPO}" --body "## 🗑️ Preview Codespace Deleted

            The preview codespace for branch \`${BRANCH}\` has been deleted."
          else
            echo "No codespace found to delete."
          fi

