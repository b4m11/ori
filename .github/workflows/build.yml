name: Build and Release

on:
  push:
    branch: main
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
      shell: bash

    - name: Build with PyInstaller
      run: |
        SEP=":"
        if [ "${{ runner.os }}" = "Windows" ]; then
          SEP=";"
        fi
        pyinstaller --name dev_setup --onefile --collect-submodules plugins --add-data "web_ui/index.html${SEP}web_ui" dev_setup.py
      shell: bash

    - name: Rename Artifact for Windows
      if: runner.os == 'Windows'
      run: mv dist/dev_setup.exe dist/dev_setup-windows.exe
      shell: bash

    - name: Rename Artifact for Linux
      if: runner.os == 'Linux'
      run: mv dist/dev_setup dist/dev_setup-linux
      shell: bash

    - name: Rename Artifact for macOS
      if: runner.os == 'macOS'
      run: mv dist/dev_setup dist/dev_setup-macos
      shell: bash

    - name: Upload artifact to Actions
      uses: actions/upload-artifact@v4
      with:
        name: dev_setup-${{ runner.os }}
        path: dist/dev_setup*

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/alpha')
      with:
        files: dist/dev_setup*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
