name: Build and Release

on:
  push:
    branch: main
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
      shell: bash

    - name: Build with PyInstaller
      run: |
        SEP=":"
        if [ "${{ runner.os }}" = "Windows" ]; then
          SEP=";"
        fi
        pyinstaller --name ifa --onefile --add-data "web_ui${SEP}web_ui" --add-data "plugins${SEP}plugins" --add-data "core${SEP}core" dev_setup.py
      shell: bash

    - name: Rename Artifact for Windows
      if: runner.os == 'Windows'
      run: mv dist/ifa.exe dist/ifa-windows.exe
      shell: bash

    - name: Rename Artifact for Linux
      if: runner.os == 'Linux'
      run: mv dist/ifa dist/ifa-linux
      shell: bash

    - name: Rename Artifact for macOS
      if: runner.os == 'macOS'
      run: mv dist/ifa dist/ifa-macos
      shell: bash

    - name: Upload artifact to Actions
      uses: actions/upload-artifact@v4
      with:
        name: dev_setup-${{ runner.os }}
        path: dist/ifa*

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Build
        files: dist/ifa*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
