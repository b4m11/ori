<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEV_SETUP // SYSTEM CONFIGURATOR</title>
  <meta name="description" content="ORI_ dev setup system configurator — select plugins and install your development environment." />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#32cd32',
            'accent-dark': '#28a428',
            accent2: '#7b61ff',
            dark: '#0a0a0a',
            'dark-fg': '#f0f0ec',
            bg: '#f0f0ec',
            muted: '#6b6b6b',
            card: '#ffffff',
          },
          fontFamily: {
            mono: ["'Space Mono'", "'Courier New'", 'monospace'],
          },
          animation: {
            pulse2: 'pulse2 2s ease-in-out infinite',
          },
          keyframes: {
            pulse2: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.3' },
            },
          },
        },
      },
    };
  </script>

  <style>
    /* Base */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #f0f0ec;
      font-family: 'Space Mono', 'Courier New', monospace;
      color: #0a0a0a;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #32cd32; }

    /* Checkbox styling */
    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      border: 2px solid #0a0a0a;
      background: #f0f0ec;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    input[type="checkbox"]:checked {
      background: #32cd32;
      border-color: #32cd32;
    }
    input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      top: -2px;
      left: 1px;
      font-size: 10px;
      font-weight: 700;
      color: #0a0a0a;
    }

    /* Status dot pulse animation */
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #32cd32;
      margin-right: 0.5rem;
      animation: pulse2 2s ease-in-out infinite;
    }
    @keyframes pulse2 {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Terminal ::before label */
    .terminal-wrap { position: relative; }
    .terminal-wrap::before {
      content: '> TERMINAL_OUTPUT';
      display: block;
      padding: 0.35rem 1rem;
      background: #32cd32;
      color: #0a0a0a;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Section label separator */
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #0a0a0a;
      opacity: 0.2;
    }

    /* Vue fade transition */
    .fade-enter-active, .fade-leave-active { transition: opacity 0.2s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }

    /* Sub-item checkbox (smaller, purple checked) */
    .sub-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border: 1.5px solid #6b6b6b;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .sub-checkbox:checked {
      background: #7b61ff;
      border-color: #7b61ff;
    }
    .sub-checkbox:checked::after {
      content: '✓';
      position: absolute;
      top: -2px;
      left: 0;
      font-size: 9px;
      font-weight: 700;
      color: white;
    }

    /* Plugin card checkbox */
    .plugin-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border: 2px solid #0a0a0a;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .plugin-checkbox:checked {
      background: #32cd32;
      border-color: #32cd32;
    }
    .plugin-checkbox:checked::after {
      content: '✓';
      position: absolute;
      top: -2px;
      left: 0px;
      font-size: 9px;
      font-weight: 700;
      color: #0a0a0a;
    }
  </style>
</head>

<body class="bg-bg font-mono text-dark text-[13px] leading-relaxed">

  <!-- TOP BAR -->
  <div class="flex items-center justify-between px-6 py-3 border-b-2 border-dark bg-card">
    <div class="font-bold text-base tracking-[2px] uppercase">✦ DEV<span class="text-accent2">_</span>SETUP</div>
    <nav class="flex gap-6 text-[0.75rem] uppercase tracking-[1.5px] text-muted">
      <a href="#" class="text-muted hover:text-dark transition-colors no-underline">/ Categories</a>
      <a href="#" class="text-muted hover:text-dark transition-colors no-underline">/ Plugins</a>
      <a href="#" class="text-muted hover:text-dark transition-colors no-underline">/ Install</a>
    </nav>
    <div class="text-[0.7rem] uppercase tracking-[1px] text-muted text-right leading-snug">
      SYS.TIME<br>
      <span id="clock"></span>
    </div>
  </div>

  <div id="app"></div>

  <script type="module">
    import { createApp, ref, onMounted, computed, watch, nextTick } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';

    // Live clock
    const clockEl = document.getElementById('clock');
    setInterval(() => {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString('en-GB', { hour12: false }) + ' UTC' + (now.getTimezoneOffset() > 0 ? '-' : '+') + Math.abs(now.getTimezoneOffset() / 60);
    }, 1000);

    const App = {
      setup() {
        const profiles = ref([]);
        const plugins = ref([]);
        const selectedProfiles = ref([]);
        const selectedPlugins = ref([]);
        const output = ref('');
        const logs = ref([]);
        const showLogs = ref(false);
        const sidebarOpen = ref(true);
        const searchQuery = ref('');
        const step = ref('plugins'); // start directly at plugins

        const categoryMap = computed(() => {
          const map = {};
          profiles.value.forEach(cat => {
            const parts = cat.split('>');
            if (parts.length === 2) {
              const [parent, sub] = parts;
              if (!map[parent]) map[parent] = [];
              map[parent].push(cat);
            } else {
              if (!map[cat]) map[cat] = [];
            }
          });
          return map;
        });

        const parentSelected = (parent) => {
          const children = categoryMap.value[parent] || [];
          if (children.length === 0) return selectedProfiles.value.includes(parent);
          return children.every(c => selectedProfiles.value.includes(c));
        };

        const parentPartial = (parent) => {
          const children = categoryMap.value[parent] || [];
          if (children.length === 0) return false;
          const count = children.filter(c => selectedProfiles.value.includes(c)).length;
          return count > 0 && count < children.length;
        };

        const toggleParent = (parent, checked) => {
          const children = categoryMap.value[parent] || [];
          if (checked) {
            if (!selectedProfiles.value.includes(parent)) selectedProfiles.value.push(parent);
            children.forEach(c => { if (!selectedProfiles.value.includes(c)) selectedProfiles.value.push(c); });
          } else {
            selectedProfiles.value = selectedProfiles.value.filter(v => v !== parent && !children.includes(v));
          }
        };

        const filteredPlugins = computed(() => {
          let list = plugins.value;
          if (selectedProfiles.value.length > 0) {
            list = list.filter(p =>
              p.categories.some(cat => selectedProfiles.value.includes(cat))
            );
          }
          if (searchQuery.value.trim()) {
            const q = searchQuery.value.trim().toLowerCase();
            list = list.filter(p => p.name.toLowerCase().includes(q));
          }
          return list;
        });

        const selectedCount = computed(() => selectedProfiles.value.length);
        const pluginCount = computed(() => selectedPlugins.value.length);

        const loadData = async () => {
          const res = await fetch('/api/profiles');
          const profData = await res.json();
          profiles.value = profData.profiles;
          const pRes = await fetch('/api/plugins');
          const plugData = await pRes.json();
          plugins.value = plugData.plugins;
        };

        const goToPlugins = () => { step.value = 'plugins'; };
        const goToCategories = () => { step.value = 'categories'; };
        const goToConfirm = () => { step.value = 'confirm'; };

        const runInstall = async () => {
          step.value = 'install';
          console.log(selectedPlugins.value);
          await fetch('/api/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              profiles: selectedProfiles.value,
              plugins: selectedPlugins.value,
            }),
          });
          const source = new EventSource('/api/stream');
          source.onmessage = e => {
            if (e.data.startsWith('[LOGFILE]')) {
              try {
                const payload = JSON.parse(e.data.slice(9));
                logs.value.push({ name: payload.name, content: payload.content });
              } catch (err) {
                console.error('Failed to parse log file payload', err);
              }
            } else {
              output.value += e.data + '\n';
              nextTick(() => {
                const term = document.querySelector('.terminal-pre');
                if (term) term.scrollTop = term.scrollHeight;
              });
            }

            console.log(e.data);
            if (e.data.startsWith('[DONE]')) {
              step.value = 'done';
              return;
            }
          };
          source.onerror = () => {
            source.close();
            step.value = 'done';
          };
        };

        const reset = () => {
          selectedProfiles.value = [];
          selectedPlugins.value = [];
          output.value = '';
          logs.value = [];
          step.value = 'plugins';
        };

        const togglePlugin = (name) => {
          const idx = selectedPlugins.value.indexOf(name);
          if (idx >= 0) selectedPlugins.value.splice(idx, 1);
          else selectedPlugins.value.push(name);
        };
        const toggleSidebar = () => {
          sidebarOpen.value = !sidebarOpen.value;
        };

        const allFilterKeys = computed(() => {
          const keys = [];
          Object.entries(categoryMap.value).forEach(([parent, children]) => {
            if (children.length === 0) keys.push(parent);
            else children.forEach(c => keys.push(c));
          });
          return keys;
        });

        const allSelected = computed(() =>
          allFilterKeys.value.length > 0 &&
          allFilterKeys.value.every(k => selectedProfiles.value.includes(k))
        );

        const toggleAllFilters = () => {
          if (allSelected.value) {
            selectedProfiles.value = [];
          } else {
            selectedProfiles.value = [...allFilterKeys.value];
          }
        };

        onMounted(loadData);

        return {
          profiles, plugins, selectedProfiles, selectedPlugins,
          output, logs, step, categoryMap, parentSelected, parentPartial,
          toggleParent, filteredPlugins, selectedCount, pluginCount,
          goToPlugins, goToCategories, goToConfirm, runInstall, reset, togglePlugin, showLogs,
          sidebarOpen, toggleSidebar, allSelected, toggleAllFilters, searchQuery,
        };
      },
      template: `
      <div class="max-w-[1100px] mx-auto px-6 pb-12">

        <!-- HERO -->
        <div class="border-2 border-dark bg-dark text-dark-fg px-10 py-12 mt-6 relative overflow-hidden">
          <div class="absolute top-4 right-6 text-right text-[0.65rem] text-muted uppercase tracking-[1px]">
            > SYS.STATUS<br>
            <span class="text-accent">ONLINE</span><br><br>
            > PLUGINS<br>
            <span class="text-accent">{{ plugins.length }} LOADED</span>
          </div>
          <h1 class="text-[clamp(2.5rem,6vw,4.5rem)] font-bold leading-none uppercase tracking-tight mb-4">
            <span class="text-accent">ORI_</span>
          </h1>
          <p class="max-w-md text-[0.8rem] text-[#999] leading-relaxed">
            because setting up a system is stressfullll...
          </p>
        </div>

        <!-- STEP BAR -->
        <div class="flex border-2 border-dark mt-6">
          <div class="flex-1 py-3 px-4 text-center text-[0.7rem] uppercase tracking-[1.5px] font-bold border-r-2 border-dark transition-all duration-200"
               :class="step === 'plugins' ? 'bg-dark text-accent' : (step === 'confirm' || step === 'install' || step === 'done') ? 'bg-accent text-dark' : 'bg-card text-muted'">
            /01 Select Plugins
          </div>
          <div class="flex-1 py-3 px-4 text-center text-[0.7rem] uppercase tracking-[1.5px] font-bold border-r-2 border-dark transition-all duration-200"
               :class="step === 'confirm' ? 'bg-dark text-accent' : (step === 'install' || step === 'done') ? 'bg-accent text-dark' : 'bg-card text-muted'">
            /02 Confirm
          </div>
          <div class="flex-1 py-3 px-4 text-center text-[0.7rem] uppercase tracking-[1.5px] font-bold transition-all duration-200"
               :class="(step === 'install' || step === 'done') ? 'bg-dark text-accent' : 'bg-card text-muted'">
            /03 Install
          </div>
        </div>

        <!-- STEP: PLUGINS -->
        <template v-if="step === 'plugins'">
          <div class="flex gap-0 mt-0">

            <!-- SIDEBAR -->
            <div class="w-[250px] min-w-[250px] bg-card border-r-2 border-dark flex flex-col overflow-y-auto max-h-[80vh] sticky top-0">
              <div class="flex-1 overflow-y-auto p-4">
                <!-- Mobile toggle -->
                <button class="md:hidden mb-3 inline-flex items-center gap-2 px-4 py-2 text-[0.75rem] font-bold uppercase tracking-[2px] bg-transparent text-dark hover:bg-dark hover:text-dark-fg transition-all"
                        @click="toggleSidebar">
                  Filters
                </button>

                <!-- Install button pinned at bottom -->
                <div class="mb-4">
                  <button class="w-full py-2 px-4 text-[0.75rem] font-bold uppercase tracking-[2px] bg-accent text-dark border-2 border-dark hover:bg-dark hover:text-accent transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                          @click="goToConfirm" :disabled="pluginCount === 0">
                    ↳ Install {{ pluginCount > 0 ? '(' + pluginCount + ')' : '' }}
                  </button>
                </div>

                <!-- Category filters -->
                <div class="text-[0.65rem] uppercase tracking-[2px] text-muted mb-3 flex items-center gap-2">
                  Filters
                  <div class="flex-1 h-px bg-dark opacity-20"></div>
                  <button
                    @click="toggleAllFilters"
                    class="ml-1 px-2 py-0.5 text-[0.6rem] font-bold uppercase tracking-[1px] border transition-all"
                    :class="allSelected ? 'border-dark/40 text-muted hover:border-dark hover:text-dark' : 'border-accent text-accent hover:bg-accent hover:text-dark'"
                  >
                    {{ allSelected ? 'Clear' : 'All' }}
                  </button>
                </div>
                <div v-for="(children, parent) in categoryMap" :key="parent"
                     class="border-b border-dark/10 py-3 transition-colors duration-150"
                     :class="parentSelected(parent) ? 'bg-accent/10' : 'hover:bg-[#fafaf6]'">
                  <label class="flex items-center gap-2 cursor-pointer mb-2"
                         @click.prevent="toggleParent(parent, !parentSelected(parent))">
                    <input type="checkbox" class="w-[14px] h-[14px]" :checked="parentSelected(parent)" />
                    <span class="font-bold uppercase tracking-[1.5px] text-[0.8rem]">{{ parent }}</span>
                  </label>
                  <div class="ml-5 flex flex-col gap-1" v-if="children.length">
                    <label v-for="sub in children" :key="sub"
                           class="flex items-center gap-1 text-[0.75rem] text-muted hover:text-dark cursor-pointer transition-colors">
                      <input type="checkbox" class="sub-checkbox" :value="sub" v-model="selectedProfiles" />
                      {{ sub.split('>')[1] }}
                    </label>
                  </div>
                </div>

                <div class="mt-4">
                  <button class="w-full py-2 px-4 text-[0.75rem] font-bold uppercase tracking-[2px] bg-accent text-dark border-2 border-dark hover:bg-dark hover:text-accent transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                          @click="goToConfirm" :disabled="pluginCount === 0">
                    ↳ Install {{ pluginCount > 0 ? '(' + pluginCount + ')' : '' }}
                  </button>
                </div>
              </div>
            </div>

            <!-- PLUGIN CONTENT -->
            <div class="flex-1 p-4">
              <div class="section-label text-[0.7rem] uppercase tracking-[2px] text-muted mt-6 mb-3 flex items-center gap-3">
                /01 Select Plugins
                <span v-if="pluginCount" class="inline-block px-2 py-0.5 text-[0.6rem] font-bold border border-accent2 text-accent2 uppercase tracking-[1px]">{{ pluginCount }} selected</span>
              </div>

              <!-- Search bar -->
              <div class="relative mb-4">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted text-[0.7rem] pointer-events-none">⌕</span>
                <input
                  v-model="searchQuery"
                  type="text"
                  placeholder="Search plugins..."
                  class="w-full pl-8 pr-4 py-2 bg-card border-2 border-dark text-[0.75rem] uppercase tracking-[1px] text-dark placeholder:text-muted placeholder:normal-case focus:outline-none focus:border-accent transition-colors"
                />
                <button v-if="searchQuery"
                  @click="searchQuery = ''"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-dark text-[0.8rem] transition-colors">
                  ✕
                </button>
              </div>

              <div v-if="filteredPlugins.length"
                   class="grid gap-0"
                   style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));">
                <div v-for="p in filteredPlugins" :key="p.name"
                     class="border-r border-b border-dark/20 p-3 bg-card flex flex-col gap-2 cursor-pointer text-[0.75rem] uppercase tracking-[1px] transition-colors duration-150"
                     :class="selectedPlugins.includes(p.name) ? 'bg-accent/10' : 'hover:bg-[#fafaf6]'"
                     @click="!p.installed && togglePlugin(p.name)">
                  <input type="checkbox" class="plugin-checkbox" :disabled="p.installed" :checked="selectedPlugins.includes(p.name)" />
                  <span>{{ p.name }}</span>
                  <div class="flex flex-wrap gap-1 mt-auto" v-if="p.categories && p.categories.length">
                    <span v-for="cat in p.categories" :key="cat"
                          class="inline-block px-2 py-0.5 text-[0.6rem] font-bold border border-accent text-accent uppercase tracking-[1px]">
                      {{ cat }}
                    </span>
                  </div>
                  <span v-if="p.installed"
                        class="inline-block px-2 py-0.5 text-[0.6rem] font-bold border border-accent2 text-accent2 uppercase tracking-[1px] w-max">
                    Installed
                  </span>
                </div>
              </div>

              <div v-else class="border-2 border-dashed border-muted p-8 text-center text-muted text-[0.8rem] uppercase tracking-[2px] mt-4">
                {{ searchQuery ? 'No plugins match \"' + searchQuery + '\"' : 'No plugins match selected categories' }}
              </div>
            </div>
          </div>
        </template>

        <!-- STEP: INSTALL -->
        <!-- STEP: CONFIRM -->
        <template v-if="step === 'confirm'">
          <div class="border-2 border-dark bg-dark text-dark-fg mt-6">
            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b-2 border-dark/40">
              <div>
                <div class="text-[0.65rem] uppercase tracking-[2px] text-muted mb-1">/02 Confirm Installation</div>
                <h2 class="text-xl font-bold uppercase tracking-[2px] text-accent">Ready to install {{ pluginCount }} plugin{{ pluginCount === 1 ? '' : 's' }}?</h2>
              </div>
            </div>

            <!-- Plugin list -->
            <div class="p-6">
              <div class="text-[0.65rem] uppercase tracking-[2px] text-muted mb-3 flex items-center gap-3">
                Selected Plugins
                <div class="flex-1 h-px bg-dark-fg opacity-10"></div>
              </div>
              <div class="grid gap-0" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));">
                <div v-for="name in selectedPlugins" :key="name"
                     class="flex items-center gap-3 border border-dark-fg/10 px-4 py-3 bg-dark-fg/5">
                  <span class="text-accent text-[0.8rem] font-bold">✓</span>
                  <span class="text-[0.8rem] uppercase tracking-[1px] text-dark-fg">{{ name }}</span>
                </div>
              </div>

              <!-- Warning note -->
              <div class="mt-6 border border-accent/30 bg-accent/5 px-4 py-3 text-[0.7rem] text-muted uppercase tracking-[1px]">
                ⚠ This will install the above packages on your system. Review the list carefully before proceeding.
              </div>

              <!-- Action buttons -->
              <div class="flex gap-0 mt-6">
                <button class="px-6 py-3 text-[0.75rem] font-bold uppercase tracking-[2px] border-2 border-dark-fg/30 text-dark-fg hover:bg-dark-fg hover:text-dark transition-all"
                        @click="goToPlugins">
                  ← Back
                </button>
                <button class="px-8 py-3 text-[0.75rem] font-bold uppercase tracking-[2px] bg-accent text-dark border-2 border-accent hover:bg-accent-dark transition-all"
                        @click="runInstall">
                  ✓ Proceed with Installation
                </button>
              </div>
            </div>
          </div>
        </template>

        <template v-if="step === 'install'">
          <div class="text-[0.7rem] uppercase tracking-[2px] text-muted mt-8 mb-3 flex items-center gap-3 section-label">
            /03 Installation
          </div>
          <div class="terminal-wrap border-2 border-dark">
            <pre class="terminal-pre bg-dark text-accent p-6 text-[0.75rem] leading-relaxed h-auto overflow-y-auto max-h-[60vh] whitespace-pre-wrap break-all">{{ output }}</pre>
          </div>
          <div class="flex items-center justify-between px-6 py-2 border-2 border-dark border-t-0 bg-dark text-accent text-[0.65rem] uppercase tracking-[1.5px]">
            <span><span class="status-dot"></span> Process Running</span>
            <span>Plugins: {{ pluginCount }}</span>
          </div>
        </template>

        <!-- STEP: DONE -->
        <template v-if="step === 'done'">
          <div class="border-2 border-accent bg-dark text-dark-fg p-6 mt-6">
            <!-- Header row -->
            <div class="flex flex-row justify-between items-center mb-4">
              <div>
                <h2 class="text-2xl font-bold uppercase tracking-[3px] text-accent mb-1">✓ COMPLETE</h2>
                <p class="text-[0.7rem] text-muted">Please check the logs below for further information and configuration steps if possible</p>
              </div>
              <button class="inline-flex items-center gap-2 px-6 py-2 text-[0.75rem] font-bold uppercase tracking-[2px] border-2 border-dark-fg bg-accent text-dark hover:bg-dark hover:text-accent hover:border-accent transition-all"
                      @click="reset">
                Return ↗
              </button>
            </div>

            <!-- Log files -->
            <div class="flex flex-col gap-3 mt-4">
              <div v-for="log in logs" :key="log.name" class="border-2 border-dark/40">
                <div class="text-[0.7rem] uppercase tracking-[1.5px] text-accent2 px-4 py-2 border-b border-dark/20 bg-dark/20 font-bold">
                  {{ log.name }}
                </div>
                <div class="terminal-wrap">
                  <pre class="bg-dark text-accent p-4 text-[0.75rem] leading-relaxed overflow-x-auto whitespace-pre-wrap break-all">{{ log.content }}</pre>
                </div>
              </div>
            </div>
          </div>
        </template>

      </div>
      `,
    };

    createApp(App).mount('#app');
  </script>
</body>

</html>
